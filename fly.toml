# scriptorium runs as always-on machines: the relay holds live workspace
# session pairing in memory, and session-affinity routing (flyaffinity) pins
# a workspace's clients to one machine. Document content lives in peer Yjs
# docs (and, later, encrypted in Tigris) — never on this server in plaintext.
app = "scriptorium-edit"
primary_region = "jnb"

[build]
  image = "ghcr.io/richardwooding/scriptorium:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Rolling deploy: one machine at a time so at most 1/N workspaces churn;
# session affinity pins each workspace to a machine, reconnect=rejoin recovers.
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
