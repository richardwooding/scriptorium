name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -timeout 600s ./...
      - run: go vet ./...
      - name: WASM compile check
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/scriptorium-wasm
      - name: Full web build
        run: make wasm && go build ./cmd/scriptorium

  complexity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardwooding/codemetrics@v0.12.5
        with:
          max-cognitive: "15"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vendor-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Rebuild vendored JS bundles and check for drift
        run: |
          make vendor-js
          git diff --exit-code -- web/src/*.bundle.js web/src/.js-vendor-version web/src/katex.css             || { echo "::error::vendored JS bundles are out of date — run 'make vendor-js' and commit"; exit 1; }
