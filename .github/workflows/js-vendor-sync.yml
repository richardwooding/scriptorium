# Keeps the committed browser bundles in web/src honest.
#
# Two jobs:
#   regenerate — on any PR touching jsvendor/, rebuild the bundles and push the
#     result back onto the PR branch. Dependabot edits jsvendor/package.json but
#     cannot run `make vendor-js`, so without this every npm PR fails the
#     vendor-js drift check in ci.yml by construction, and fixing the branches
#     by hand does not hold: dependabot force-pushes when it rebases and the
#     regeneration is discarded.
#   weekly — catch drift on the default branch (e.g. a transitive esbuild
#     rebuild) and open a PR.
#
# Both need VENDOR_SYNC_TOKEN: a PAT or GitHub App token with Contents and
# Pull requests read/write.
#   gh secret set VENDOR_SYNC_TOKEN --repo {owner}/{repo} --body "$PAT"
# GitHub does not trigger workflows from pushes or PRs made with the built-in
# GITHUB_TOKEN, and it forces GITHUB_TOKEN to read-only on dependabot-triggered
# events. With the built-in token the push back to a dependabot branch is
# rejected outright, and a weekly drift PR would open with zero checks.
# Without the secret this falls back to github.token and keeps today's
# behaviour rather than failing the run.
name: js-vendor-sync

on:
  pull_request:
    paths:
      - "jsvendor/package.json"
      - "jsvendor/package-lock.json"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    # Same-repo branches only — a fork PR cannot be pushed back to.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: make vendor-js
      - name: Commit regenerated bundles back onto the PR branch
        env:
          SYNC_TOKEN: ${{ secrets.VENDOR_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::VENDOR_SYNC_TOKEN is not set; skipping the push-back. "\
              "The built-in token cannot write to a dependabot branch, so this"\
              " PR must be regenerated by hand until the secret exists."
            exit 0
          fi
          if git diff --quiet -- web/src/*.bundle.js web/src/.js-vendor-version web/src/katex.css; then
            echo "bundles already match the pinned versions."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/*.bundle.js web/src/.js-vendor-version web/src/katex.css
          git commit -m "chore: regenerate vendored JS bundles"
          # Re-runs this workflow; the rebuild is then a no-op, so it settles.
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:${GITHUB_HEAD_REF}"

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: make vendor-js
      - name: Open a PR if bundles changed
        env:
          GH_TOKEN: ${{ secrets.VENDOR_SYNC_TOKEN || github.token }}
          SYNC_TOKEN: ${{ secrets.VENDOR_SYNC_TOKEN }}
        run: |
          if git diff --quiet -- web/src/*.bundle.js web/src/.js-vendor-version web/src/katex.css; then
            echo "no drift."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="js-vendor-sync-$(date +%Y%m%d)"
          git switch -C "$branch"
          git add web/src/*.bundle.js web/src/.js-vendor-version web/src/katex.css
          git commit -m "chore: refresh vendored JS bundles"
          if [ -n "$SYNC_TOKEN" ]; then
            git push -f "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
              "HEAD:refs/heads/${branch}"
          else
            echo "::notice::VENDOR_SYNC_TOKEN is not set; pushing with the built-in token, so no CI will run on the PR."
            git push -f origin "HEAD:refs/heads/${branch}"
          fi
          STATE="$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)"
          if [ "$STATE" = "OPEN" ]; then
            echo "PR already open; updated the branch."
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "chore: refresh vendored JS bundles" \
              --body "Automated re-vendor of the committed browser bundles from the versions pinned in \`jsvendor/package.json\`."
          fi
